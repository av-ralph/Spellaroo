workflows:
  android-ios-workflow:
    name: Spellaroo Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # Only needed if doing automatic iOS signing
      flutter: stable
      xcode: latest
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
          flutter precache --ios
      - name: Build Android APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
      - name: Build iOS IPA
        script: |
          # Force generation of iOS config files
          flutter build ios --config-only
          
          # Build iOS. If signing is configured in Codemagic UI, this will produce an IPA.
          flutter build ios --release --no-codesign
          
          # Manually create a zip of the .app if no IPA is produced (fallback for unsigned builds)
          BUILD_DIR="build/ios/iphoneos"
          if [ -d "$BUILD_DIR/Runner.app" ]; then
            cd "$BUILD_DIR"
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r Spellaroo.ipa Payload
            # Move to a predictable location for the artifact uploader
            mv Spellaroo.ipa ../../../Spellaroo-unsigned.ipa
            cd ../../..
          else
            echo "Error: Runner.app not found in $BUILD_DIR"
            exit 1
          fi
      - name: List Artifacts (Debug)
        script: |
          find . -name "*.apk"
          find . -name "*.ipa"
    artifacts:
      - "**/Spellaroo.apk"
      - "**/app-release.apk"
      - "**/*.ipa"
    publishing:
      email:
        recipients:
          - ralphrenzbendo51@gmail.com # Change this to your email
