workflows:
  android-ios-workflow:
    name: Spellaroo Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # Only needed if doing automatic iOS signing
      flutter: stable
      xcode: latest
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
      - name: Build iOS IPA
        script: |
          # Build iOS. If signing is configured in Codemagic UI, this will produce an IPA.
          # If not, it will build the framework/app bundle.
          flutter build ios --release --no-codesign
          
          # Manually create a zip of the .app if no IPA is produced (useful for debugging)
          BUILD_DIR="build/ios/iphoneos"
          if [ -d "$BUILD_DIR/Runner.app" ]; then
            cd "$BUILD_DIR"
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r Spellaroo.ipa Payload
            mv Spellaroo.ipa ../../Spellaroo-unsigned.ipa
            cd ../../..
          fi
    artifacts:
      - build/app/outputs/flutter-apk/Spellaroo.apk
      - build/*.ipa
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ralphrenzbendo51@gmail.com # Change this to your email
